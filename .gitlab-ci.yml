# Configuration GitLab CI/CD pour Docker

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: "/certs"
  IMAGE_TAG: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
  IMAGE_LATEST: $CI_REGISTRY_IMAGE:latest

stages:
  - build
  - test
  - deploy

# Build de l'image Docker
build:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    # Build l'image
    - docker build -t $IMAGE_TAG -t $IMAGE_LATEST .
    
    # Afficher la taille de l'image
    - docker images $IMAGE_TAG
    
    # Push vers le registry
    - docker push $IMAGE_TAG
    - docker push $IMAGE_LATEST
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

# Test de l'image
test:
  stage: test
  image: docker:latest
  services:
    - docker:dind
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    # Pull l'image
    - docker pull $IMAGE_TAG
    
    # Démarrer un container de test
    - docker run -d --name test-container -p 8080:80 $IMAGE_TAG
    
    # Attendre que le container soit prêt
    - sleep 10
    
    # Vérifier que le service répond
    - apk add --no-cache curl
    - curl -f http://localhost:8080 || exit 1
    
    # Vérifier le healthcheck
    - docker exec test-container wget --quiet --tries=1 --spider http://localhost:80/
    
    # Nettoyage
    - docker stop test-container
    - docker rm test-container
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Scan de sécurité
security_scan:
  stage: test
  image: aquasec/trivy:latest
  script:
    - trivy image --severity HIGH,CRITICAL $IMAGE_TAG
  allow_failure: true
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Déploiement en production
deploy_production:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan $SERVER_HOST >> ~/.ssh/known_hosts
  script:
    - |
      ssh $SERVER_USER@$SERVER_HOST << 'EOF'
        # Login au registry
        docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
        
        # Pull la dernière image
        docker pull $IMAGE_LATEST
        
        # Arrêter et supprimer l'ancien container
        docker stop portfolio-app || true
        docker rm portfolio-app || true
        
        # Démarrer le nouveau container
        docker run -d \
          --name portfolio-app \
          -p 80:80 \
          --restart unless-stopped \
          $IMAGE_LATEST
        
        # Nettoyage
        docker system prune -af
        
        # Vérifier le statut
        sleep 5
        docker ps | grep portfolio-app
      EOF
  environment:
    name: production
    url: https://votre-domaine.com
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual

# Déploiement en staging
deploy_staging:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan $STAGING_SERVER_HOST >> ~/.ssh/known_hosts
  script:
    - |
      ssh $SERVER_USER@$STAGING_SERVER_HOST << 'EOF'
        docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
        docker pull $IMAGE_TAG
        docker stop portfolio-staging || true
        docker rm portfolio-staging || true
        docker run -d \
          --name portfolio-staging \
          -p 8080:80 \
          --restart unless-stopped \
          $IMAGE_TAG
      EOF
  environment:
    name: staging
    url: https://staging.votre-domaine.com
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual

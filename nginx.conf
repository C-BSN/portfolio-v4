server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Pages HTML — toujours revalider pour servir le contenu à jour
    location ~* \.html$ {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Routing SPA — fallback sur index.html
    location / {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri $uri/ $uri.html /index.html;
    }

    # Cache long pour les assets statiques (hachés par Next.js)
    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|svg|webp|avif|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Sécurité
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml+rss
        image/svg+xml;
}
